name: Backend CI

on:
  push:
    paths:
      - 'futsala-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'futsala-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: futsala-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: futsala-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build / Type-check Project
        run: npm run build

      - name: Run Linter
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: futsala-backend
          file: futsala-backend/Dockerfile
          push: false
          tags: futsala-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

