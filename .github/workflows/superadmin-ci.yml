name: Superadmin CI

on:
  push:
    paths:
      - 'futsala_superadmin/**'
      - '.github/workflows/superadmin-ci.yml'
  pull_request:
    paths:
      - 'futsala_superadmin/**'
      - '.github/workflows/superadmin-ci.yml'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: futsala_superadmin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: futsala_superadmin/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Run Linter
        run: npm run lint
